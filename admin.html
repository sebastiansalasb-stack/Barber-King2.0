<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barber King - Panel de Administrador</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
</head>
<body>

  <a href="#main-contenido" class="enlace-saltar">Saltar al contenido principal</a>

  <header class="header">
    <div class="marca">
      <svg class="icono-marca" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="6" cy="6" r="3"></circle>
        <circle cx="6" cy="18" r="3"></circle>
        <line x1="20" y1="4" x2="8.12" y2="15.88"></line>
        <line x1="14.47" y1="14.48" x2="20" y2="20"></line>
        <line x1="8.12" y1="8.12" x2="12" y2="12"></line>
      </svg>
      <h1>Barber King</h1>
    </div>
    <nav class="nav-principal">
      <span id="bienvenida-admin" class="bienvenida-admin">Panel de Administrador</span>
      <button id="btn-cerrar-sesion-admin" type="button">Cerrar sesión</button>
    </nav>
  </header>

  <main id="main-contenido" class="main" tabindex="-1">
    <div id="notificaciones-admin" class="lista-notificaciones" aria-live="polite" hidden></div>

    <section>
      <h2>Solicitudes de Reprogramación</h2>

      <div id="lista-solicitudes-reprogramacion" class="lista-citas">
        <p id="mensaje-sin-solicitudes" role="status" aria-live="polite" hidden>No hay solicitudes de reprogramación pendientes.</p>
      </div>
    </section>

    <section>
      <h2>Mis Citas Agendadas</h2>

      <div id="lista-admin-citas" class="lista-citas">
        <p id="mensaje-sin-citas-admin" role="status" aria-live="polite" hidden>No hay citas agendadas todavía.</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Barber King - Proyecto Desarrollo de Aplicaciones Móviles</p>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/citas.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
